---

- name: "Uninstall houdini version {{ houdini_version ~ '.' ~ houdini_build_number }}"
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf 'yes\n' | {{ houdini_install_dir }}/houdini.uninstall
    removes: "{{ houdini_install_dir }}/houdini.uninstall"

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Remove selinux module
  when: ansible_facts.selinux.status == "enabled" and "license" in houdini_features
  block:
    - name: Check installed module version
      become: true
      ansible.builtin.command:
        cmd: semodule -l
      register: semodule_list
      changed_when: false

    - name: Remove TCP port 1715 assignment from selinux
      become: true
      when: '"sesinetd" in semodule_list'
      community.general.seport:
        ports: 1715
        proto: tcp
        setype: sesinetd_port_t
        state: absent

    - name: Remove SELinux policy module for sesinetd
      become: true
      when: selinux_module_result.stdout == "sesinetd"
      ansible.builtin.command:
        cmd: semodule -r sesinetd
      register: remove_module_result
      changed_when: remove_module_result.rc == 0

- name: Stop and disable hqueue-server and client service
  become: true
  when: item in ansible_facts.services
  loop:
    - "hqueue-server.service"
    - "hqueue-client.service"
    - "sesinetd.service"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    daemon_reload: true

- name: Remove sesinetd service
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/system/sesinetd.service"
    state: "absent"

- name: Remove sidefx directories
  become: true
  loop:
    - /opt/hqueue
    - /opt/sidefx
    - /opt/sidefx_packages
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent

- name: Reload systemd service daemon
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

...
